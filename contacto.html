<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Universidad Icel</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <!-- Barra de navegación: ahora todos los enlaces llevan a páginas reales. -->
    <nav class="navbar">
        <div class="logo"> <img src="Logo.png" alt="Logo de la Universidad Icel" class="logo-logo"></div>
        <!-- Botón de hamburguesa, solo visible en celular. -->
        <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">&#9776;</button>
        <ul class="nav-links" id="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="acerca.html">Acerca de nosotros</a></li>
            <li class="desplegable">
                <a href="#" class="btn-desplegable">Catálogo ▼</a>
                <ul class="submenu">
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="ofertas.html">Ofertas</a></li>
                </ul>
            </li>
            <li><a href="ubicacion.html">Ubicación</a></li>
            <li><a href="contacto.html" class="activo">Contáctanos</a></li>
            <li><a href="login.html">Iniciar sesión</a></li>
        </ul>
    </nav>

    <div class="contenedor-login-centrado">
        <div class="bloque-login">
            <h1 class="login-titulo">Contáctanos</h1>
            <p class="login-subtitulo">Escríbenos y te respondemos lo antes posible.</p>
            <form class="form-contacto" novalidate>
            <div class="campo-formal">
                <label for="c-nombre">Nombre</label>
                <input type="text" id="c-nombre" name="nombre" placeholder="Tu nombre completo" autocomplete="name">
                <p class="error-campo" role="alert"></p>
            </div>
            <div class="campo-formal">
                <label for="c-correo">Correo</label>
                <input type="text" id="c-correo" name="correo" placeholder="nombre@correo.com" autocomplete="email">
                <p class="error-campo" role="alert"></p>
            </div>
            <div class="campo-formal">
                <label for="c-mensaje">Mensaje</label>
                <textarea id="c-mensaje" name="mensaje" placeholder="¿En qué podemos ayudarte?"></textarea>
                <p class="error-campo" role="alert"></p>
            </div>
                <button type="submit" class="boton-formal">Enviar mensaje</button>
                <p class="mensaje" role="status"></p>
            </form>
        </div>
    </div>


    <!-- JavaScript compartido: menú, formularios y login. -->
    <script src="script.js"></script>
</body>
</html>
