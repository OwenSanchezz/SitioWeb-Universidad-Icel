        <div class="logo"> <img src="Logo.png" alt="Logo de la Universidad Icel" class="logo-logo"></div>
        <!-- Botón de hamburguesa, solo visible en celular. -->

        <ul class="nav-links" id="menu">

    <div class="contenedor-login-centrado">
        <div class="bloque-login">
            <h1 class="login-titulo">Recuperar contraseña</h1>
            <p class="login-subtitulo">Escribe tu correo y te enviaremos las instrucciones.</p>
            <form id="formRecuperar" novalidate>
                <div class="campo-formal">
                    <label for="correoRecuperar">Correo</label>
                    <input type="text" id="correoRecuperar" placeholder="usuario@correo.com" autocomplete="email">
                    <p class="error-campo" role="alert"></p>
                </div>
                <button type="submit" class="boton-formal">Enviar instrucciones</button>
                <p class="mensaje" role="status"></p>
            </form>
            <div class="pie-login"><p><a href="login.html">← Volver a iniciar sesión</a></p></div>
        </div>
    </div>
